# GitHub Pages: publishes public/ under /<repo>/. Only the front end: the data (/api) needs the Cloudflare Worker.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site for a subfolder
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          cp -r public _site
          # assets relative to <base>, so deep links like /aureo/a/GC=F still find them; 404.html = SPA fallback
          sed -i -e "s|<head>|<head>\n<base href=\"$base\">|" -e 's|href="/styles.css"|href="styles.css"|; s|href="/favicon.svg"|href="favicon.svg"|; s|src="/help.js"|src="help.js"|; s|src="/app.js"|src="app.js"|' _site/index.html
          cp _site/index.html _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
